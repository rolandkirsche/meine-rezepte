<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6fa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Meine Rezepte"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Meine Rezepte</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202332;background:#f5f6fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}.wrap{max-width:980px;margin:auto;padding:env(safe-area-inset-top) 22px 40px}.top{display:flex;align-items:center;justify-content:space-between;padding:32px 0 22px}.brand{display:flex;align-items:center;gap:13px}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,#5588ff,#3865d9);display:grid;place-items:center;color:white;font-size:24px;box-shadow:0 7px 18px #496fd433}h1{font-size:28px;margin:0;letter-spacing:-.5px}.sub{color:#787d8c;margin-top:4px}.add{border:0;border-radius:14px;background:#386ce5;color:white;font-size:16px;font-weight:650;padding:14px 18px;cursor:pointer;box-shadow:0 5px 14px #386ce533}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}.stat,.card,.empty{background:#fff;border:1px solid #ebedf3;border-radius:20px;padding:20px;box-shadow:0 5px 20px #1d264008}.stat small{display:block;color:#7c8190;font-size:13px;margin-bottom:9px}.stat strong{font-size:26px}.section-title{font-size:16px;margin:24px 0 12px;color:#666b79;font-weight:650}.meds{display:grid;gap:12px}.card{display:flex;gap:16px;align-items:center;padding:18px 20px}.pill{width:46px;height:46px;flex:none;border-radius:15px;background:#eef3ff;color:#4172df;display:grid;place-items:center;font-size:22px}.card.warn .pill{background:#fff4e6;color:#dd871e}.info{min-width:0;flex:1}.name{font-size:17px;font-weight:700}.detail,.status{font-size:13px;color:#777d8b;margin-top:5px}.days{text-align:right;min-width:82px}.days strong{font-size:25px}.days small{display:block;font-size:12px;color:#777d8b}.actions{display:flex;gap:8px;margin-left:4px}.iconbtn{border:1px solid #e7e9ef;background:white;color:#606676;border-radius:11px;padding:9px 10px;cursor:pointer;font-size:14px}.empty{text-align:center;color:#7b8090;padding:42px 20px}.empty b{display:block;color:#343949;font-size:18px;margin-bottom:7px}dialog{border:0;padding:0;border-radius:22px;width:min(520px,calc(100% - 28px));box-shadow:0 25px 100px #10172a44}dialog::backdrop{background:#141a2b77;backdrop-filter:blur(3px)}form{padding:24px}.form-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.form-head h2{margin:0;font-size:22px}.close{border:0;background:#f0f1f5;border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer}label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}input,select{width:100%;padding:13px 14px;border:1px solid #dfe2e9;border-radius:12px;font:inherit;background:white}input:focus,select:focus{outline:2px solid #83a5ff;border-color:#4f7be7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:23px}.secondary,.save{border:0;border-radius:12px;padding:12px 17px;font:inherit;font-weight:650;cursor:pointer}.secondary{background:#f0f1f5}.save{background:#386ce5;color:white}.hint{color:#858a98;font-size:12px;margin-top:10px}@media(max-width:620px){.wrap{padding-left:15px;padding-right:15px}.top{padding-top:23px}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:21px}.card{gap:11px;padding:15px 12px}.pill{width:40px;height:40px}.days{min-width:60px}.actions{flex-direction:column}.iconbtn{padding:7px}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div class="brand"><div class="logo">✚</div><div><h1>Meine Rezepte</h1><div class="sub">Medikamentenvorrat einfach im Blick</div></div></div><button class="add" id="add">＋ <span class="add-label">Hinzufügen</span></button></header>
<section class="stats"><div class="stat"><small>Medikamente</small><strong id="count">0</strong></div><div class="stat"><small>Bald nachbestellen</small><strong id="urgent">0</strong></div><div class="stat"><small>Rezepte angefordert</small><strong id="requested">0</strong></div></section>
<div id="content"></div>
</main>
<dialog id="dlg"><form id="medform"><div class="form-head"><h2 id="formtitle">Medikament hinzufügen</h2><button type="button" class="close" id="close">×</button></div><input type="hidden" id="id"><label for="name">Medikament</label><input id="name" required maxlength="80" placeholder="z. B. Blutdruckmedikament"><label for="strength">Stärke (optional)</label><input id="strength" maxlength="50" placeholder="z. B. 10 mg"><div class="grid"><div><label for="quantity">Vorrat (Stück)</label><input id="quantity" type="number" min="0" step="1" value="30" required></div><div><label for="daily">Verbrauch pro Tag</label><input id="daily" type="number" min="0.01" step="0.25" value="1" required></div></div><div class="grid"><div><label for="warning">Warnen ab (Tage)</label><input id="warning" type="number" min="1" max="365" value="14" required></div><div><label for="status">Rezeptstatus</label><select id="status"><option>Noch anzufordern</option><option>Angefordert</option><option>Erhalten</option></select></div></div><div class="hint">Deine Einträge werden nur in diesem Browser gespeichert.</div><div class="form-actions"><button type="button" class="secondary" id="cancel">Abbrechen</button><button class="save" type="submit">Speichern</button></div></form></dialog>
<script>
const KEY='meine-rezepte.web.v1';let meds=[];try{meds=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}
const $=id=>document.getElementById(id), dlg=$('dlg');function persist(){localStorage.setItem(KEY,JSON.stringify(meds));render()}function left(m){return Math.ceil((+m.quantity)/(+m.daily||1))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const urgent=meds.filter(m=>left(m)<=+m.warning&&m.status!=='Erhalten');$('count').textContent=meds.length;$('urgent').textContent=urgent.length;$('requested').textContent=meds.filter(m=>m.status==='Angefordert').length;const ordered=[...meds].sort((a,b)=>left(a)-left(b));if(!meds.length){$('content').innerHTML='<div class="empty"><b>Noch keine Medikamente</b>Füge dein erstes Medikament hinzu, um den Vorrat und anstehende Rezeptanfragen zu verfolgen.</div>';return}let soon=ordered.filter(m=>left(m)<=+m.warning&&m.status!=='Erhalten'),rest=ordered.filter(m=>!soon.includes(m));const row=m=>`<article class="card ${left(m)<=+m.warning&&m.status!=='Erhalten'?'warn':''}"><div class="pill">✚</div><div class="info"><div class="name">${esc(m.name)}</div><div class="detail">${m.strength?esc(m.strength)+' · ':''}${m.quantity} Stück · ${m.daily} täglich</div><div class="status">${esc(m.status)}${left(m)<=+m.warning&&m.status!=='Erhalten'?' · Bald nachbestellen':''}</div></div><div class="days"><strong>${left(m)}</strong><small>Tage Vorrat</small></div><div class="actions"><button class="iconbtn" data-edit="${m.id}">Bearbeiten</button><button class="iconbtn" data-addstock="${m.id}">＋ Packung</button></div></article>`;$('content').innerHTML=(soon.length?'<h2 class="section-title">Bald nachbestellen</h2><div class="meds">'+soon.map(row).join('')+'</div>':'')+(rest.length?'<h2 class="section-title">Deine Medikamente</h2><div class="meds">'+rest.map(row).join('')+'</div>':'');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll('[data-addstock]').forEach(b=>b.onclick=()=>{const m=meds.find(x=>x.id===b.dataset.addstock);m.quantity=+m.quantity+30;m.status='Erhalten';persist()})}
function edit(id){const m=meds.find(x=>x.id===id);if(!m)return;$('formtitle').textContent='Medikament bearbeiten';$('id').value=m.id;$('name').value=m.name;$('strength').value=m.strength||'';$('quantity').value=m.quantity;$('daily').value=m.daily;$('warning').value=m.warning;$('status').value=m.status;dlg.showModal()}
function openNew(){$('formtitle').textContent='Medikament hinzufügen';$('medform').reset();$('id').value='';$('quantity').value=30;$('daily').value=1;$('warning').value=14;dlg.showModal()}$('add').onclick=openNew;$('close').onclick=$('cancel').onclick=()=>dlg.close();dlg.onclick=e=>{if(e.target===dlg)dlg.close()};$('medform').onsubmit=e=>{e.preventDefault();const item={id:$('id').value||crypto.randomUUID(),name:$('name').value.trim(),strength:$('strength').value.trim(),quantity:+$('quantity').value,daily:+$('daily').value,warning:+$('warning').value,status:$('status').value};const i=meds.findIndex(m=>m.id===item.id);if(i<0)meds.push(item);else meds[i]=item;persist();dlg.close()};render();if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
